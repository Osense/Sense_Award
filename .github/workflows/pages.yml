name: Deploy GitHub Pages

# main에 올리면 점검 후 site 폴더를 gh-pages 브랜치로 내보낸다(GitHub Pages가 gh-pages를 서비스).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify app
        run: npm test
      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true
          commit_message: "배포: ${{ github.event.head_commit.message }}"
